# =====================================================================
#  Réglages du scoring des entreprises et des secteurs
#  ---------------------------------------------------------------
#  Les poids se modifient ici sans toucher au code.
#  direction : "haut"  -> plus la valeur est haute, meilleur est le score
#              "bas"   -> plus la valeur est basse, meilleur est le score
# =====================================================================

universe:
  # Liste du S&P 500 (Wikipédia, tenue à jour en continu)
  sp500: true
  # Euro Stoxx élargi : la composition officielle est réservée aux abonnés STOXX.
  # On la reconstitue : les N plus grandes capitalisations dont le siège est dans
  # un pays de la zone euro, cotées sur une bourse de la zone euro
  # (l'Euro Stoxx 50 est toujours inclus).
  eurostoxx_size: 300
  eurostoxx_min_cap_eur: 1500000000
  rebuild_every_days: 30

# Normalisation dans le secteur : on écrête aux 5e et 95e centiles,
# puis Min-Max sur 0-100. Un secteur avec moins de 8 entreprises
# est comparé à l'ensemble de l'univers.
clip_percentile: 0.05
min_sector_size: 8

families:
  valorisation:
    label: "Valorisation"
    description: "Le prix payé : PER, cours / valeur comptable, dividende. Une note haute signale une action moins chère que ses concurrentes. Non testable sur le passé : Yahoo ne fournit pas l'historique des ratios."
    weight: 20
    metrics:
      pe:          { label: "PER",                         direction: bas,  unit: "x" }
      pb:          { label: "Cours / valeur comptable",    direction: bas,  unit: "x" }
      div_yield:   { label: "Rendement du dividende",      direction: haut, unit: "%" }
  dynamique:
    label: "Dynamique"
    description: "La tendance du cours. C'est la famille la plus utile d'après nos tests 2023-2025 : les 20 % d'entreprises les mieux notées ont battu les 20 % les moins bien notées d'environ 7 points par an."
    weight: 30
    metrics:
      perf_12m_ex1m: { label: "Performance 12 mois (hors dernier mois)", direction: haut, unit: "%" }
      perf_3m:       { label: "Performance 3 mois",                      direction: haut, unit: "%" }
      ma200_gap:     { label: "Écart à la moyenne 200 jours",            direction: haut, unit: "%" }
  risque:
    label: "Risque"
    description: "Un filtre défensif : volatilité, bêta, dette, pire baisse. Elle ne fait pas gagner plus (les titres les moins risqués ont moins progressé en 2023-2025, une période de forte hausse) mais réduit nettement les mauvaises surprises : 4 fois moins d'écarts de performance."
    weight: 20
    metrics:
      vol_1y:        { label: "Volatilité sur 1 an",         direction: bas,  unit: "%" }
      beta:          { label: "Bêta",                        direction: bas,  unit: "" }
      debt_equity:   { label: "Dette / fonds propres",       direction: bas,  unit: "%" }
      max_dd_1y:     { label: "Pire baisse sur 1 an",        direction: haut, unit: "%" }
  qualite:
    label: "Qualité"
    description: "La solidité de l'activité : rentabilité des fonds propres, marge, croissance du chiffre d'affaires. Non testable sur le passé faute d'historique des ratios."
    weight: 30
    metrics:
      roe:           { label: "Rentabilité des fonds propres (ROE)", direction: haut, unit: "%" }
      op_margin:     { label: "Marge opérationnelle",                 direction: haut, unit: "%" }
      rev_growth:    { label: "Croissance du chiffre d'affaires",     direction: haut, unit: "%" }

# Profils proposés sur le site (le premier est celui par défaut : il doit reprendre les poids ci-dessus).
# Le site recalcule les notes dans le navigateur ; l'historique et les tests restent sur le profil par défaut.
default_profile: equilibre
profiles:
  - id: equilibre
    label: "Équilibré long terme"
    description: "Privilégie la dynamique du cours et la qualité de l'activité, les deux familles les mieux étayées sur longue période ; valorisation et risque comptent moins."
    weights: { valorisation: 20, dynamique: 30, risque: 20, qualite: 30 }
  - id: performance
    label: "Performance"
    description: "Cherche les entreprises qui devraient le plus progresser : forte place à la dynamique, la seule famille au signal positif dans nos tests 2023-2025, au prix de davantage de variations."
    weights: { valorisation: 20, dynamique: 40, risque: 15, qualite: 25 }
  - id: prudent
    label: "Prudent"
    description: "Cherche le meilleur rapport entre gain et risque : forte place au risque et à la qualité. Dans nos tests, les titres retenus progressent moins mais plus régulièrement."
    weights: { valorisation: 15, dynamique: 20, risque: 35, qualite: 30 }

# Données manquantes
#  - une valeur manquante reçoit une note neutre (la médiane du secteur = 50)
#  - une entreprise en perte n'a pas de PER : elle reçoit 0 sur ce critère
#  - certains critères ne s'appliquent pas à un secteur (dette des banques)
#  - au-delà de max_missing critères manquants, l'entreprise n'est pas notée
missing_data:
  neutral_score: 50
  max_missing: 3
  not_applicable:
    debt_equity: ["Financial Services"]

# Score d'un secteur = part "entreprises" + part "tendance de marché",
# La part "entreprises" utilise le score UNIVERS (critères notés face aux ~790 entreprises),
# sinon chaque secteur aurait une moyenne de ~50 par construction.
# puis ajustement selon le baromètre macro.
sector_score:
  company_weight: 0.6     # moyenne des scores des entreprises, pondérée par la capitalisation
  trend_weight: 0.4       # tendance de l'indice du secteur (écart MM200 et perf. 6 mois, sur 5 ans)
  macro_tilt: 0.2         # ajustement = 0,2 x (score macro - 50) : au plus +/- 10 points

sectors:
  Technology:             { label: "Technologie",             type: cyclique }
  Communication Services: { label: "Télécoms et médias",      type: neutre }
  Consumer Cyclical:      { label: "Consommation cyclique",   type: cyclique }
  Consumer Defensive:     { label: "Consommation de base",    type: defensif }
  Healthcare:             { label: "Santé",                   type: defensif }
  Financial Services:     { label: "Finance",                 type: cyclique }
  Industrials:            { label: "Industrie",               type: cyclique }
  Basic Materials:        { label: "Matériaux",               type: cyclique }
  Energy:                 { label: "Énergie",                 type: cyclique }
  Utilities:              { label: "Services publics",        type: defensif }
  Real Estate:            { label: "Immobilier",              type: neutre }
