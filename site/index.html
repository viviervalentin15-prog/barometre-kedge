<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baromètre des marchés – KEDGE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231f4e8c%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/echarts.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Baromètre des marchés <span class="brand-sub">KEDGE · Gestion d'actifs</span></a>
    <nav class="nav">
      <a class="nav-link" data-route="home" href="#/">Accueil</a>
      <a class="nav-link" data-route="macro" href="#/macro">Baromètre macro</a>
      <a class="nav-link" data-route="companies" href="#/entreprises">Entreprises</a>
      <a class="nav-link" data-route="pools" href="#/pools">Pools <span class="badge" id="pool-count" hidden></span></a>
    </nav>
  </header>

  <main class="page">
    <div id="demo-banner" class="banner" hidden></div>
    <section class="toolbar">
      <div class="segmented" id="zone-switch" role="group" aria-label="Zone">
        <button data-view="commun" class="on">US + zone euro</button>
        <button data-view="US">États-Unis</button>
        <button data-view="EZ">Zone euro</button>
      </div>
      <div class="updated" id="updated"></div>
    </section>
    <div id="app"></div>
  </main>

  <div class="pool-bar" id="pool-bar" hidden>
    <span id="pool-bar-text"></span>
    <button class="btn ghost" id="pool-clear">Vider</button>
    <a class="btn" href="#/pools">Voir la sélection</a>
  </div>

  <footer class="footer">Sources : FRED, OCDE, Eurostat, BCE, Yahoo Finance, Wikipédia · Projet étudiant, pas un conseil en investissement.</footer>
</body>
</html>
