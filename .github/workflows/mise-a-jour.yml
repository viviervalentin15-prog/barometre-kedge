# Mise à jour des données du baromètre.
# - Manuelle : onglet "Actions" du dépôt GitHub > "Mise à jour des données" > "Run workflow"
#   (le bouton du site déclenchera ce même processus à l'étape 4)
# - Automatique : chaque lundi à 6 h (heure de Paris en hiver)
name: Mise à jour des données

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques Python
        run: pip install -r requirements.txt

      - name: Calculer le baromètre macro
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_macro.py

      - name: Noter les entreprises et les secteurs
        run: python scripts/build_companies.py

      - name: Calculer les prévisions (séparées du score)
        continue-on-error: true   # un échec ici ne doit pas empêcher d'enregistrer le reste
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_predictions.py

      - name: Tester les scores sur le passé (analyse)
        continue-on-error: true
        run: python scripts/analyse_decision.py > /dev/null

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "barometre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Mise à jour des données ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main && git push
          fi

      - name: Contrôle de santé des données
        run: python scripts/check_health.py --report sante.md

      # En cas de problème : un ticket GitHub « alerte-donnees » (e-mail au propriétaire du dépôt).
      - name: Ouvrir ou compléter une alerte
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f sante.md ] || echo "Une étape de la collecte a échoué : voir ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > sante.md
          echo -e "\n[Détail de la collecte](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> sante.md
          gh label create alerte-donnees --color d73a4a --description "Problème détecté dans la collecte" --force
          n=$(gh issue list --label alerte-donnees --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file sante.md
          else gh issue create --title "Alerte données : problème dans la collecte du $(date -u +%d/%m/%Y)" --label alerte-donnees --body-file sante.md; fi

      - name: Fermer l'alerte si tout est rentré dans l'ordre
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label alerte-donnees --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Collecte du $(date -u +%d/%m/%Y) sans problème : alerte fermée automatiquement."
          done
