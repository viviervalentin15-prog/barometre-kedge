# Tests sur le passé : les scores aident-ils à décider ? (lancement manuel)
name: Analyse des scores
on: workflow_dispatch
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/analyse_decision.py
      - run: |
          git config user.name "barometre-bot"; git config user.email "actions@users.noreply.github.com"
          git add site/data/analyse.json
          git diff --cached --quiet || (git commit -m "Analyse des scores" && git pull --rebase origin main && git push)
