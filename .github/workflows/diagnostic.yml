name: Diagnostic sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests
      - run: python scripts/diagnostic.py
      - run: |
          git config user.name "barometre-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/diagnostic.txt && git commit -m "Diagnostic des sources" && git pull --rebase && git push
