# Réglages Netlify : le site est déjà prêt dans le dossier "site",
# il n'y a rien à compiler.
[build]
  publish = "site"
  command = ""

# Fonction du bouton « Mettre à jour » (voir netlify/functions/mise-a-jour.mjs)
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
